name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅构建与校验，不实际发布'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $PKG 不一致，请先同步版本号"
            exit 1
          fi

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Build library and service worker
        run: pnpm build

      - name: Verify build artifacts
        run: node scripts/verify-dist.mjs

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          # npm >= 11.5 才支持 OIDC trusted publishing；
          # 这里锁 11.x，因为 npm 12 要求 Node >= 22，而 runner 为 Node 20
          npm install -g npm@11
          npm --version

          npm config set registry https://registry.npmjs.org/

          if [ -n "${NPM_TOKEN}" ]; then
            echo "认证方式：NPM_TOKEN secret"
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          else
            echo "认证方式：OIDC trusted publishing（未提供 NPM_TOKEN）"
            npm config delete //registry.npmjs.org/:_authToken || true
          fi

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "检测到预发布版本，使用 next dist-tag"
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
