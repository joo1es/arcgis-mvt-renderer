<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SceneView MVT 绕向三向对比</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f5f3; }
  header { padding: 12px 18px; border-bottom: 1px solid #ddd; background: #fff; }
  header h1 { margin: 0 0 3px; font-size: 15px; font-weight: 500; color: #222; }
  header p { margin: 0; font-size: 12px; color: #666; line-height: 1.55; }
  .grid { display: flex; height: calc(100vh - 76px); }
  .panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; min-width: 0; }
  .panel:last-child { border-right: none; }
  .label { padding: 7px 12px; font-size: 12px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .label b { font-weight: 500; font-size: 12px; white-space: nowrap; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .tag.bad { background: #FCEBEB; color: #A32D2D; }
  .tag.fix { background: #FAEEDA; color: #854F0B; }
  .tag.good { background: #E1F5EE; color: #0F6E56; }
  .view { flex: 1; position: relative; }
  .status { position: absolute; left: 8px; bottom: 8px; right: 8px; z-index: 5; font-size: 11px; padding: 5px 8px; border-radius: 4px; background: rgba(0,0,0,.75); color: #fff; line-height: 1.45; }
</style>
</head>
<body>
<header>
  <h1>SceneView + 原生 VectorTileLayer：绕向三向对比</h1>
  <p>同一份公开瓦片（MapLibre demotiles，世界国家面 z0–2）。中、左两栏字节完全相同，唯一差别是中间一栏经过 Service Worker 实时修正绕向。</p>
</header>
<div class="grid">
  <div class="panel">
    <div class="label"><b>违规原始</b><span class="tag bad">外环 CCW</span></div>
    <div class="view" id="viewBad"><div class="status" id="statusBad">初始化…</div></div>
  </div>
  <div class="panel">
    <div class="label"><b>SW 实时修正</b><span class="tag fix">native-fixed</span></div>
    <div class="view" id="viewFix"><div class="status" id="statusFix">注册 Service Worker…</div></div>
  </div>
  <div class="panel">
    <div class="label"><b>合规原始</b><span class="tag good">外环 CW</span></div>
    <div class="view" id="viewGood"><div class="status" id="statusGood">初始化…</div></div>
  </div>
</div>

<script type="module">
import Map from 'https://js.arcgis.com/4.32/@arcgis/core/Map.js'
import SceneView from 'https://js.arcgis.com/4.32/@arcgis/core/views/SceneView.js'
import VectorTileLayer from 'https://js.arcgis.com/4.32/@arcgis/core/layers/VectorTileLayer.js'

function buildStyle(tilePath) {
  return {
    version: 8,
    sources: {
      countries: {
        type: 'vector',
        tiles: [tilePath + '/{z}/{x}/{y}.pbf'],
        minzoom: 0,
        maxzoom: 2,
      },
    },
    layers: [
      { id: 'country-fill', type: 'fill', source: 'countries', 'source-layer': 'countries',
        paint: { 'fill-color': '#4a90d9', 'fill-opacity': 0.85 } },
      { id: 'country-line', type: 'line', source: 'countries', 'source-layer': 'countries',
        paint: { 'line-color': '#ffffff', 'line-width': 0.8 } },
    ],
  }
}

function createPanel({ containerId, statusId, tilePath, label }) {
  const status = document.getElementById(statusId)
  const setStatus = (t) => { status.textContent = t }

  const layer = new VectorTileLayer({ style: buildStyle(tilePath), title: label })
  const view = new SceneView({
    container: containerId,
    map: new Map({ layers: [layer] }),
    camera: { position: { longitude: 15, latitude: 25, z: 21000000 }, tilt: 0 },
    environment: { background: { type: 'color', color: [20, 28, 38] } },
    ui: { components: ['attribution'] },
  })

  layer.load()
    .then(() => setStatus(`${label} · 图层已加载`))
    .catch((e) => setStatus(`${label} · 加载失败: ${e.message}`))

  view.when()
    .then(() => setStatus(`${label} · 视图就绪`))
    .catch((e) => setStatus(`${label} · 视图失败: ${e.message}`))

  return { view, layer, setStatus }
}

async function setupServiceWorker() {
  if (!('serviceWorker' in navigator)) return { ok: false, reason: '浏览器不支持 Service Worker' }

  try {
    await navigator.serviceWorker.register('./mvt-sw.js', { scope: '/' })
  } catch (e) {
    return { ok: false, reason: `注册失败: ${e.message}` }
  }

  if (!navigator.serviceWorker.controller) {
    await new Promise((resolve) => {
      const timer = setTimeout(resolve, 5000)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        clearTimeout(timer); resolve()
      }, { once: true })
    })
  }

  const controller = navigator.serviceWorker.controller
  if (!controller) return { ok: false, reason: 'Service Worker 尚未接管页面' }

  // 只拦截 /tiles/live/，避免影响另外两栏
  controller.postMessage({ type: 'set-patterns', patterns: ['/tiles/live/'] })
  await new Promise((r) => setTimeout(r, 200))

  return { ok: true }
}

// 左右两栏：直接读取原始字节，不经过任何修正
createPanel({ containerId: 'viewBad', statusId: 'statusBad', tilePath: './tiles/bad', label: '违规原始' })
createPanel({ containerId: 'viewGood', statusId: 'statusGood', tilePath: './tiles/good', label: '合规原始' })

// 中间一栏：先注册 SW 并确认生效，再加载图层
const sw = await setupServiceWorker()
const fixPanel = createPanel({ containerId: 'viewFix', statusId: 'statusFix', tilePath: './tiles/live', label: 'SW 修正' })

if (sw.ok) {
  try {
    const probe = await fetch('./tiles/live/2/2/1.pbf')
    const marker = probe.headers.get('x-mvt-winding')
    const detail = probe.headers.get('x-mvt-winding-detail')
    const size = (await probe.arrayBuffer()).byteLength
    fixPanel.setStatus(
      `SW 已接管 · 标记: ${marker} · ${size} bytes · 判定: ${detail}` +
      (marker === 'fixed' ? ' · 绕向已在传输层修正' : '')
    )
  } catch (e) {
    fixPanel.setStatus(`SW 已接管，但探测请求失败: ${e.message}`)
  }
} else {
  fixPanel.setStatus(`Service Worker 不可用: ${sw.reason}`)
}
</script>
</body>
</html>
